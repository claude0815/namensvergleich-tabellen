[project]
name = "namematch"
version = "0.1.0"
description = "Offline-Tool zum Zusammenführen zweier Personenlisten (Excel/CSV) über den Namen"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.5",
    "rapidfuzz==3.14.6",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
]

[tool.pytest.ini_options]
# Netzwerk-Sockets sind in ALLEN Tests gesperrt (Offline-Nachweis, pytest-socket).
addopts = "--disable-socket"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "langsam: länger laufende Tests (z. B. 5.000 × 5.000 Zeilen); abwählbar mit -m 'not langsam'",
]
