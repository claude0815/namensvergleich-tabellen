# Automatische Tests unter Linux, macOS und Windows sowie Bau des portablen Windows-Programms.
# Läuft ausschließlich mit den synthetischen Testdaten aus tests/fixtures – niemals mit echten Daten.
# Netzwerk-Sockets sind in allen Tests gesperrt (pytest-socket, siehe pyproject.toml).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Abhängigkeiten installieren (feste Versionen)
        run: python -m pip install -r requirements-dev.txt
      - name: Tests (Netzwerk gesperrt)
        run: python -m pytest -p no:cacheprovider

  windows-programm:
    name: Windows-Programm bauen (PyInstaller)
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build-Abhängigkeiten installieren (feste Versionen)
        run: python -m pip install -r requirements-build.txt
      - name: Programm bauen
        run: python -m PyInstaller --noconfirm --clean packaging/namematch.spec
      - name: Probelauf des fertigen Programms mit synthetischen Testdaten
        shell: pwsh
        run: |
          $exe = "dist\namematch\namematch.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version fehlgeschlagen" }
          $ziel = Join-Path $env:RUNNER_TEMP "ergebnis.xlsx"
          & $exe tests\fixtures\schueler_a.xlsx tests\fixtures\schueler_b_semikolon_cp1252.csv -o $ziel --ja
          if ($LASTEXITCODE -ne 0) { throw "Lauf fehlgeschlagen" }
          if (-not (Test-Path $ziel)) { throw "Ergebnisdatei fehlt" }
          & $exe tests\fixtures\webuntis_a_mac.csv tests\fixtures\schuelerliste_b.xlsx --dry-run
          if ($LASTEXITCODE -ne 0) { throw "Probelauf (Mac-CSV) fehlgeschlagen" }
      - name: Selbsttest der grafischen Oberfläche (Fenster öffnet, lädt, führt zusammen, schließt)
        shell: pwsh
        run: |
          $ziel = Join-Path $env:RUNNER_TEMP "ergebnis_gui.xlsx"
          $argumente = @("--selbsttest", "tests\fixtures\webuntis_a_mac.csv", "tests\fixtures\schuelerliste_b.xlsx", $ziel)
          $prozess = Start-Process -FilePath "dist\namematch\namematch-gui.exe" -ArgumentList $argumente -Wait -PassThru
          if ($prozess.ExitCode -ne 0) { throw "GUI-Selbsttest fehlgeschlagen (Exit $($prozess.ExitCode))" }
          if (-not (Test-Path $ziel)) { throw "Ergebnisdatei der GUI fehlt" }
      - name: Paket zusammenstellen
        shell: pwsh
        run: |
          Copy-Item packaging\LIESMICH.txt dist\namematch\
          Copy-Item einstellungen.beispiel.toml dist\namematch\
      - uses: actions/upload-artifact@v4
        with:
          name: namematch-windows
          path: dist/namematch
          retention-days: 30
